<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — QBank</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e0f2f5 0%, #b9dde3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(23, 94, 122, 0.1);
      width: 100%;
      max-width: 420px;
      border: 1px solid #e2e8f0;
    }
    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-header h1 { color: #175e7a; margin-bottom: 8px; font-size: 26px; font-weight: 800; }
    .auth-header p { color: #718096; font-size: 14px; }
    
    .error-msg { 
      color: #c62828; 
      font-size: 14px; 
      font-weight: 600;
      margin-bottom: 16px; 
      text-align: center; 
      display: none; 
      background: #ffebee;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ffcdd2;
    }

    .input-group { margin-bottom: 20px; }
    .input-group label { 
      display: block; 
      font-size: 13px; 
      font-weight: 700; 
      color: #175e7a; 
      margin-bottom: 6px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 1px solid #e2e8f0; 
      border-radius: 8px; 
      font-size: 15px; 
      outline: none; 
      transition: all 0.15s;
      font-family: inherit;
    }
    .input-group input:focus { 
      border-color: #5ab4c5; 
      box-shadow: 0 0 0 3px rgba(90, 180, 197, 0.2); 
    }

    .btn-primary { 
      width: 100%; 
      padding: 16px; 
      background: #5ab4c5; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 12px; 
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-primary:hover { background: #4aa0b0; }
    .btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #a0aec0;
      font-size: 13px;
      font-weight: 600;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }

    .btn-google { 
      width: 100%; 
      padding: 14px; 
      background: white; 
      border: 1px solid #e2e8f0; 
      border-radius: 8px; 
      font-size: 15px; 
      font-weight: 600; 
      color: #4a5568; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-google:hover { background: #f9fbfc; border-color: #cbd5e0; }

    .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #4a5568; }
    .auth-footer a { color: #175e7a; font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Log in to continue your preparation</p>
    </div>

    <div id="login-error" class="error-msg"></div>
    
    <form id="login-form" onsubmit="event.preventDefault(); submitLogin();">
      <div class="input-group">
        <label>Email or Phone Number</label>
        <input type="text" id="login-identifier" required placeholder="">
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="">
      </div>
      
      <button type="submit" id="login-btn" class="btn-primary">Log In</button>
    </form>

    <div class="divider">OR</div>

    <!-- Google OAuth Button -->
    <button type="button" onclick="signInWithGoogle()" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-footer">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
