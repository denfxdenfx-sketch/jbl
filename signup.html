<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — QBank</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e0f2f5 0%, #b9dde3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(23, 94, 122, 0.1);
      width: 100%;
      max-width: 420px;
      border: 1px solid #e2e8f0;
    }
    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-header h1 { color: #175e7a; margin-bottom: 8px; font-size: 26px; font-weight: 800; }
    .auth-header p { color: #718096; font-size: 14px; }
    
    .error-msg { 
      color: #c62828; 
      font-size: 14px; 
      font-weight: 600;
      margin-bottom: 16px; 
      text-align: center; 
      display: none; 
      background: #ffebee;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ffcdd2;
    }

    .input-group { margin-bottom: 20px; }
    .input-group label { 
      display: block; 
      font-size: 13px; 
      font-weight: 700; 
      color: #175e7a; 
      margin-bottom: 6px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 1px solid #e2e8f0; 
      border-radius: 8px; 
      font-size: 15px; 
      outline: none; 
      transition: all 0.15s;
      font-family: inherit;
    }
    .input-group input:focus { 
      border-color: #5ab4c5; 
      box-shadow: 0 0 0 3px rgba(90, 180, 197, 0.2); 
    }

    .btn-primary { 
      width: 100%; 
      padding: 16px; 
      background: #5ab4c5; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 12px; 
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-primary:hover { background: #4aa0b0; }
    .btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; }

    .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #4a5568; }
    .auth-footer a { color: #175e7a; font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Create an Account</h1>
      <p>Join QBank to start your preparation</p>
    </div>

    <div id="signup-error" class="error-msg"></div>
    
    <form id="signup-form" onsubmit="event.preventDefault(); submitSignup();">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="signup-email" required placeholder="doctor@example.com">
      </div>
      
      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="signup-phone" required placeholder="+91 9876543210">
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signup-password" required placeholder="Minimum 6 characters">
      </div>
      
      <button type="submit" id="signup-btn" class="btn-primary">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
